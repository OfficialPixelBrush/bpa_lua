name: Build & Release

# Manual-only. Lets you type the release notes at trigger-time and builds
# the addon module for 5 targets, then publishes one GitHub Release with
# all the binaries attached.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag for this release (e.g. v1.0)"
        required: true
      release_name:
        description: "Release title (leave blank to reuse the tag)"
        required: false
      draft:
        description: "Create as a draft (review before publishing)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

env:
  BINARY_NAME: bpa_lua
  LUA_VERSION: "5.4"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Sanity check: tag_name must match the VERSION file, which must also
  # match the version string baked into src/bpa_lua.cpp's bp_addon_info.
  # ---------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag_name matches VERSION and bp_addon_info
        shell: bash
        run: |
          TAG="${{ inputs.tag_name }}"
          TAG_VERSION="${TAG#v}"  # strip a leading "v" (e.g. v1.0 -> 1.0)

          FILE_VERSION=$(tr -d '[:space:]' < VERSION)

          # Third field of the bp_addon_info{} literal returned by bp_addon().
          SRC_VERSION=$(grep -A3 'bp_addon_info{' src/bpa_lua.cpp | sed -n '3p' | grep -oP '"\K[^"]+')

          echo "tag_name:      $TAG"
          echo "tag version:   $TAG_VERSION"
          echo "VERSION file:  $FILE_VERSION"
          echo "bp_addon_info: $SRC_VERSION"

          if [ -z "$FILE_VERSION" ] || [ -z "$SRC_VERSION" ]; then
            echo "::error::Could not read a version from VERSION and/or src/bpa_lua.cpp"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$FILE_VERSION" ] || [ "$TAG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Version mismatch: tag implies '${TAG_VERSION}', VERSION file has '${FILE_VERSION}', bp_addon_info has '${SRC_VERSION}'. Make all three agree before releasing."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Windows x86_64
  # ---------------------------------------------------------------------
  windows-x64:
    needs: check-version
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Use runner-preinstalled vcpkg
        shell: pwsh
        run: |
          # GitHub's windows-2022 image ships vcpkg already; reuse it instead
          # of cloning fresh (faster + avoids network flakiness).
          Copy-Item -Recurse "$env:VCPKG_INSTALLATION_ROOT" "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg\installed
          key: vcpkg-x64-windows-static-lua-${{ env.LUA_VERSION }}

      - name: Install Lua (static)
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install lua:x64-windows-static'

      - name: "Build (Release settings: /O2 /MT, no debug info)"
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /DNDEBUG /LD `
            /I "$env:VCPKG_ROOT\installed\x64-windows-static\include" `
            src\bpa_lua.cpp `
            /Fe:$env:BINARY_NAME.dll `
            /link /LIBPATH:"$env:VCPKG_ROOT\installed\x64-windows-static\lib" lua.lib

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:BINARY_NAME.dll" $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out\* -DestinationPath "$env:BINARY_NAME-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.BINARY_NAME }}-windows-x86_64.zip

  # ---------------------------------------------------------------------
  # Windows arm64 (native GH-hosted arm64 Windows runner)
  # ---------------------------------------------------------------------
  windows-arm64:
    needs: check-version
    runs-on: windows-11-arm
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Use runner-preinstalled vcpkg
        shell: pwsh
        run: |
          Copy-Item -Recurse "$env:VCPKG_INSTALLATION_ROOT" "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg\installed
          key: vcpkg-arm64-windows-static-lua-${{ env.LUA_VERSION }}

      - name: Install Lua (static)
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install lua:arm64-windows-static'

      - name: "Build (Release settings: /O2 /MT, no debug info)"
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /DNDEBUG /LD `
            /I "$env:VCPKG_ROOT\installed\arm64-windows-static\include" `
            src\bpa_lua.cpp `
            /Fe:$env:BINARY_NAME.dll `
            /link /LIBPATH:"$env:VCPKG_ROOT\installed\arm64-windows-static\lib" lua.lib

      - name: Package
        shell: pwsh
        run: |
          $out = "package"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:BINARY_NAME.dll" $out\
          Copy-Item README.md,LICENSE $out\
          Compress-Archive -Path $out\* -DestinationPath "$env:BINARY_NAME-windows-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: ${{ env.BINARY_NAME }}-windows-arm64.zip

  # ---------------------------------------------------------------------
  # Linux x86_64 (glibc) - native
  # ---------------------------------------------------------------------
  linux-x86_64:
    needs: check-version
    runs-on: ubuntu-22.04 # glibc 2.35, a broadly-compatible baseline
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liblua${LUA_VERSION}-dev pkg-config zip

      - name: "Build (Release settings: -O2, stripped)"
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -s -shared -fPIC \
            src/bpa_lua.cpp -o ${BINARY_NAME}.so \
            $(pkg-config --cflags --libs lua${LUA_VERSION})

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp ${BINARY_NAME}.so "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-linux-x86_64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ env.BINARY_NAME }}-linux-x86_64.zip

  # ---------------------------------------------------------------------
  # Linux aarch64 (glibc) - native GH-hosted arm64 Linux runner (no
  # cross-compilation needed)
  # ---------------------------------------------------------------------
  linux-aarch64:
    needs: check-version
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liblua${LUA_VERSION}-dev pkg-config zip

      - name: "Build (Release settings: -O2, stripped)"
        run: |
          g++ -std=c++17 -O2 -DNDEBUG -s -shared -fPIC \
            src/bpa_lua.cpp -o ${BINARY_NAME}.so \
            $(pkg-config --cflags --libs lua${LUA_VERSION})

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp ${BINARY_NAME}.so "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-linux-aarch64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: ${{ env.BINARY_NAME }}-linux-aarch64.zip

  # ---------------------------------------------------------------------
  # macOS arm64 (Apple Silicon / M-series) - native GH-hosted arm64 runner
  # ---------------------------------------------------------------------
  macos-arm64:
    needs: check-version
    runs-on: macos-15 # native Apple Silicon (M-series) runner
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install lua

      - name: "Build (Release settings: -O2, stripped)"
        run: |
          LUA_PREFIX="$(brew --prefix lua)"
          clang++ -std=c++17 -O2 -DNDEBUG -shared -fPIC -undefined dynamic_lookup \
            -I"${LUA_PREFIX}/include/lua${LUA_VERSION}" -L"${LUA_PREFIX}/lib" -llua${LUA_VERSION} \
            src/bpa_lua.cpp -o ${BINARY_NAME}.so
          strip -x ${BINARY_NAME}.so

      - name: Package
        run: |
          out=package
          mkdir -p "$out"
          cp ${BINARY_NAME}.so "$out"/
          cp README.md LICENSE "$out"/
          (cd "$out" && zip -r "../${BINARY_NAME}-macos-arm64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.BINARY_NAME }}-macos-arm64.zip

  # ---------------------------------------------------------------------
  # Publish everything as one GitHub Release
  # ---------------------------------------------------------------------
  release:
    needs:
      - check-version
      - windows-x64
      - windows-arm64
      - linux-x86_64
      - linux-aarch64
      - macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name || inputs.tag_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/**/*.zip
